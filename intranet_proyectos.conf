server {
    listen 80;
    server_name proyectos.odecopack.co www.proyectos.odecopack.co 190.85.248.102 190.90.52.254 10.75.45.4;
    client_max_body_size 50m;

    # Estáticos y media vía Gunicorn (WhiteNoise + SERVE_MEDIA), no desde disco en Nginx.
    # Así no dependemos de permisos/SELinux del volumen Podman (403 tras cada up/collectstatic).
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    # Media vía Gunicorn: evita 403 SELinux (container_file_t) cuando Nginx lee ./media con alias.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
