version: "3.8"

# En Oracle Linux, nombres cortos (mariadb, redis) suelen resolverse a
# container-registry.oracle.com y exigen login. Forzar Docker Hub:
services:
  db:
    image: docker.io/library/mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-proyectos_intranet}
      MARIADB_USER: ${DB_USER:-proyectos}
      MARIADB_PASSWORD: ${DB_PASSWORD:-proyectos}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    # Dockerfile.prebuilt = sin imagen Node (evita "no space left on device" en servidores pequeños).
    # Compila el frontend en tu PC: npm ci && npm run build_prod, luego sube el repo con dist/.
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: intranet_proyectos.settings
      DJANGO_CONFIGURATION: OnPrem
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Escuchar en todas las interfaces del host (necesario para acceder por IP LAN)
    ports:
      - "0.0.0.0:8000:8000"
    # :U = Podman ajusta propietario del directorio del host al usuario del contenedor
    # (evita PermissionError en collectstatic con Podman rootless). :Z = SELinux.
    # Antes del primer up: mkdir -p media staticfiles
    volumes:
      - ./media:/app/media:U,Z
      - ./staticfiles:/app/staticfiles:U,Z

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: intranet_proyectos.settings
      DJANGO_CONFIGURATION: OnPrem
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "intranet_proyectos.celeryapp", "worker", "--loglevel=info"]

volumes:
  db_data:
  redis_data:

